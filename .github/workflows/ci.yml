name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hexaqualify
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: hexaqualify_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U hexaqualify" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_HOST: 127.0.0.1
      DB_USERNAME: hexaqualify
      DB_PASSWORD: secret
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, intl, zip
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Dependency audit (PHP)
        run: composer audit
      - run: npm ci
      - name: Dependency audit (JS)
        run: npm audit --audit-level=high
      - run: npm run build
      - run: cp .env.example .env && php artisan key:generate
      - name: Code style
        run: vendor/bin/pint --test
      - name: Tests (incl. §6.3 scoring tests and vendor payload test)
        run: vendor/bin/pest
